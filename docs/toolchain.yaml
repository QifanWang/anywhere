# 跨平台「工具与功能」清单对照
version: 1

platforms:
  win11:
    tools:
      rmux:       { role: 终端复用, version: 0.10.0, config: config/rmux/rmux.conf }
      eza:        { role: 目录列表, version: 0.23.5, config: config/eza/aliases.ps1 }
      glow:       { role: Markdown 阅读与预览, version: 3.0.0, config: config/glow/glow.yml }
      yazi:       { role: 文件管理与预览, version: 26.9.1, config: config/yazi/ }
      helix:      { role: 模态编辑器, version: 25.07.1, config: config/helix/config.toml }
      fd:         { role: 文件查找, version: 10.2.0, config: null }
      fzf:        { role: 模糊搜索, version: 0.75.0, config: null }
      lazygit:    { role: Git 面板, version: 0.66.3, config: null }
      zoxide:     { role: 目录跳转, version: 0.10.0, config: config/shell/profile.ps1 }
      oh-my-posh: { role: 提示符, version: 31.1.3, config: config/oh-my-posh/anywhere.omp.json }
      PSReadLine: { role: 历史搜索与输入提示, version: 随 PowerShell 7, config: config/shell/profile.ps1 }

  linux-fedora:
    tools:
      tmux:    { role: 终端复用, version: 2.7, config: config/tmux/tmux.conf }
      yazi:    { role: 文件管理与预览, version: 26.9.1, config: config/yazi/ }
      fd:      { role: 文件查找, version: 10.2.0, config: null }
      fzf:     { role: 模糊搜索, version: 0.75.0, config: config/shell/env.sh }
      lazygit: { role: Git 面板, version: 0.66.3, config: null }
      glow:    { role: Markdown 阅读与预览, version: 3.0.0, config: config/glow/glow.yml }
      eza:     { role: 目录列表, version: 0.23.5, config: config/eza/aliases.sh }
      helix:   { role: 模态编辑器, version: 25.07.1, config: config/helix/config.toml }

functions:
  - role: 终端复用
    win11: rmux
    linux: tmux
    note: 前缀键均为 C-b；RMUX 原生 ConPTY，tmux 为系统 2.7
  - role: 目录列表
    win11: eza
    linux: eza
    note: 别名实现分别为 aliases.ps1 / aliases.sh
  - role: 文件管理与预览
    win11: yazi
    linux: yazi
    note: g d / g c 路径按平台分支；g f / g i / g v 全平台（win11 依赖已齐）；win11 的 markdown 精读与预览走 config/yazi/scripts/glow.ps1
  - role: 文件查找
    win11: fd
    linux: fd
    note: 无配置文件
  - role: 模糊搜索
    win11: fzf
    linux: fzf
    note: FZF_DEFAULT_COMMAND 在 profile.ps1 用 fd 设候选源；yazi 的 z 键依赖 fzf 二进制
  - role: Git 面板
    win11: lazygit
    linux: lazygit
    note: yazi 的 gi 键为 Unix 专用，win11 下不显示
  - role: Markdown 阅读与预览
    win11: glow
    linux: glow
    note: 非 TTY 用 glow - < file；预览需 --color=always
  - role: 模态编辑
    win11: helix
    linux: helix
    note: 命令为 hx；两平台共用 config/helix/config.toml
  - role: Shell wrapper
    win11: profile.ps1（eza 别名 + PSReadLine + zoxide + oh-my-posh + y / yg / gw）
    linux: y / yg / gw
    note: y = 退出 yazi 后 cd；yg = 选文件后 glow 精读；gw = 按终端宽度渲染 glow。Unix 定义在 config/shell/env.sh；win11 定义在 config/shell/profile.ps1，由 $PROFILE 一行 dot-source
  - role: 目录跳转
    win11: zoxide（z / zi）
    linux: 未配置
    note: z 直达按访问频率匹配，zi 用 fzf 交互选择（复用已装的 fzf）；zoxide 接管 cd，与 yazi 的 z 键无关
  - role: 历史搜索与输入提示
    win11: PSReadLine
    linux: 未配置
    note: PowerShell 7 内置模块；上下键前缀搜历史、Tab 菜单补全、基于历史的灰色预测；要求 >= 2.2.6
  - role: 提示符
    win11: oh-my-posh（anywhere.omp.json）
    linux: 未配置
    note: 主题与 yazi 同为 Catppuccin 风格；需 Nerd Font；一份主题可用于 bash / zsh / PowerShell
