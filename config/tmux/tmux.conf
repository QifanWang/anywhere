# ============================================================
# tmux - private config
# 适用平台: macOS / Linux / WSL（win11 用 config/rmux/rmux.conf）
# 安装位置: ~/.tmux.conf（tmux < 3.1）或 ~/.config/tmux/tmux.conf（tmux >= 3.1）
# 实测环境: tmux 2.7 / TencentOS Server 3.3（RHEL 系，见 docs/linux-fedora/INSTALL.md）
# 风格: 刻意保持极简。前缀键保持出厂默认 C-b（不 unbind、不 set prefix）；
#       copy-mode 保持默认 emacs 风格（搜索用 C-s / C-r，不是 vi 的 /）。
#       如需 vi 风格 / Catppuccin 状态栏，参考 git 历史版本自行加回。
# ============================================================

set -g mouse on

# 滚轮直接滚动 pane 历史（配合上面的 mouse on）
# pane 历史上限调大到 50000，避免长输出（如 agent 全量展开）被截断
set -g history-limit 50000

# 新窗口继承当前 pane 目录
bind c new-window -c "#{pane_current_path}"
# 左右 / 上下分屏同理
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
