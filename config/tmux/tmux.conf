# ============================================================
# tmux - private config
# 适用平台: macOS / Linux / WSL（win11 用 config/rmux/rmux.conf）
# 安装位置: ~/.config/tmux/tmux.conf
# ============================================================

# ---------- 基本 ----------
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g display-time 2000
set -g display-panes-time 2000
set -g status-interval 5
set -g mouse on
set -g focus-events on

# ---------- 前缀键 ----------
# 保持出厂默认 C-b，不做自定义。若以后要改成 C-a，在此加入：
#   unbind C-b
#   set -g prefix C-a
#   bind C-a send-prefix

# ---------- 重载配置 ----------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ---------- 窗口 / 面板 ----------
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------- 复制模式 (vi) ----------
setw -g mode-keys vi
bind [ copy-mode
bind ] paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# 优先使用系统剪贴板：WSL 用 clip.exe，Unix 用 xclip / wl-copy
if-shell 'command -v clip.exe >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"'
if-shell 'command -v xclip >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"'
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'

# ---------- 外观 (Catppuccin Mocha 风格) ----------
set -g status on
set -g status-position bottom
set -g status-bg "#1e1e2e"
set -g status-fg "#cdd6f4"
set -g status-left-length 30
set -g status-right-length 50
set -g status-left '#[fg=#1e1e2e,bg=#89b4fa,bold] #{?session_name,#S,-} '
set -g status-right '#[fg=#a6adc8] %Y-%m-%d %H:%M #[fg=#1e1e2e,bg=#a6e3a1,bold] #(whoami) '

setw -g window-status-format '#[fg=#a6adc8] #I:#W '
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W '
setw -g window-status-separator ''

set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#a6e3a1'
set -g message-style 'fg=#1e1e2e,bg=#f9e2af,bold'
set -g message-command-style 'fg=#1e1e2e,bg=#89b4fa,bold'
