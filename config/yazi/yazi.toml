# yazi - private config
# 适用平台: 全平台通用（opener 内用 for = "windows" / "unix" 区分平台）
# 位置: ~/.config/yazi/yazi.toml 或 %APPDATA%\yazi\config\yazi.toml
# 参考: https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[preview]
wrap = "no"
tab_size = 4
image_delay = 50
image_filter = "lanczos3"
image_quality = 75

# 跨平台 opener：同一份配置里按平台选择命令
[opener]
edit = [
  { run = "$EDITOR %s", block = true, for = "unix" },
  { run = "code %s", block = true, desc = "Edit in VS Code", for = "windows" },
]
open = [
  { run = "xdg-open %s1", desc = "Open", for = "unix" },
  { run = 'cmd /c start "" %s1', desc = "Open", for = "windows" },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "image/*", use = "open" },
  { mime = "{audio,video}/*", use = "open" },
  { url = "*.md", use = "edit" },
]
