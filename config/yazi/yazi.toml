# yazi - private config
# 适用平台: linux-fedora 实测（TencentOS Server 3.3 / RHEL 系，无 GUI 服务器）；
#           平台差异用条目内 for = "unix" / "windows" 字段区分，win11 / macOS 未实测
# 位置: ~/.config/yazi/yazi.toml 或 %APPDATA%\yazi\config\yazi.toml
# 实测版本: yazi 26.9.1（musl 静态包，见 docs/linux-fedora/INSTALL.md）
# 参考: https://yazi-rs.github.io/docs/configuration/yazi
#
# 要点（实测踩坑，详见 docs/linux-fedora/INSTALL.md）：
# - markdown 用 glow 插件渲染预览、目录用 eza 插件树状预览（plugins/ 已随仓库入库）
# - git 角标三件套缺一不可：本文件 prepend_fetchers + init.lua 的
#   require("git"):setup + theme.toml [git] 段配色
# - .md 的 mime 实测是 text/plain 而非 text/markdown，规则必须加 url 兜底
# - yazi 26.9.1 对目录的 mime 判定是 "folder/*"，不是 inode/directory

[mgr]
# 三栏比例：父目录 / 当前目录 / 预览
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_dir_first = true
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 600
max_height    = 900
image_delay   = 30
image_filter  = "triangle"
image_quality = 75

[plugin]
# markdown 用 glow 渲染预览；插件见 plugins/glow.yazi/main.lua
# 目录用 eza 树状预览（覆盖内置 folder）；插件见 plugins/eza.yazi/main.lua
# prepend 保证优先于内置默认的 { mime = "text/*", run = "code" } / { mime = "folder/*", run = "folder" }
# url 与 mime 双规则兜底（mime 库对 .md 的判定在不同系统上可能不同）
prepend_previewers = [
  { mime = "folder/*", run = "eza" },
  { url = "*.md", run = "glow" },
  { url = "*.markdown", run = "glow" },
  { mime = "text/markdown", run = "glow" },
]

# git.yazi 插件（plugins/git.yazi，已入库）的 fetchers：
# 列表数据变化时后台跑 git status --porcelain，结果供 linemode 角标渲染
# （init.lua）与 vcs-files 视图复用。url = "*" 匹配文件、url = "*/" 匹配目录
# （目录状态 = 内部最严重子状态冒泡）。非 git 目录自动跳过，无性能负担。
prepend_fetchers = [
  { url = "*",   run = "git", group = "git" },
  { url = "*/",  run = "git", group = "git" },
]

[opener]
# block = true：less 在 yazi 前台交互，q 退出回到 yazi
#
# ⚠️ 不能用 "PAGER='less -R' glow -p %s"：glow 在 TTY 下输出 OSC 8 超链接
#    （以 BEL \a 结尾），老版 less（< 590）不支持 OSC 8，会把序列拆坏显示。
#    改为显式管道，sed 剥掉 OSC 8 再交给 less（-p 无法插过滤：pager 由 glow 内部拉起）。
# 显式 GLOW_WIDTH：stdout 非 TTY 时 glow 宽度兜底 80，用 tput cols 取 pane 实宽；
#   显式非 0 可突破 glow v3 的 120 列上限。
# sed 的 ESC(\u001B)/BEL(\u0007) 在 TOML 里必须用 \uXXXX 转义（TOML 禁原始控制字符）。
# 注：%s 多文件时 "- < f1 f2" 语法不成立，精读场景按单文件使用；多文件用 shell 的
#   gw / cat 文件 | glow 包装。
glow = [
  { run = "GLOW_WIDTH=\"$(tput cols)\" glow -s dark - < %s | sed -E 's/\u001B]8;[^\u0007]*\u0007//g; s/\u0007//g' | less -R", desc = "glow", for = "unix", block = true },
]
# helix（block = true：前台交互，:q 退出回 yazi；%s 多文件时 hx 会开多 buffer）
# linux-fedora 实测：~/.local/bin/hx 源码编译（glibc 2.28 无法用官方包）
hx = [
  { run = "hx %s", desc = "helix", for = "unix", block = true },
]
# 跨平台编辑 / 打开（unix 用 $EDITOR / xdg-open；win11 用 VS Code / cmd start）
# 本机 EDITOR=hx（见 config/shell/env.sh），此处为非交互环境的兜底与 win11 的入口
edit = [
  { run = "$EDITOR %s", block = true, for = "unix" },
  { run = "code %s", block = true, desc = "Edit in VS Code", for = "windows" },
]
open = [
  { run = "xdg-open %s1", desc = "Open", for = "unix" },
  { run = 'cmd /c start "" %s1', desc = "Open", for = "windows" },
]

[open]
# o/Enter 用列表第一个（glow）；O 交互式选择 glow / hx / edit
# ⚠️ .md 的 mime 实测是 text/plain 而非 text/markdown（file --mime-type 验证），
#    与 previewers 一样必须加 url 规则兜底，否则 o 直接落到内置 edit/reveal
# 最后一条 text/* 把其他文本的默认动作改为 hx：无 GUI 服务器上内置的
# reveal（xdg-open）无法运行，会以 "N left" 挂在任务队列
# prepend_rules 是增量添加（优先于内置默认）；全量覆盖才用 rules = [...]（改写前
# 必须先复制官方默认规则集）。win11 未实测：glow / hx 为 unix 专属 opener，
# 如报错可在 use 列表追加 "edit"（VS Code）
prepend_rules = [
  { mime = "text/markdown", use = [ "glow", "hx" ] },
  { url = "*.md",           use = [ "glow", "hx" ] },
  { url = "*.markdown",     use = [ "glow", "hx" ] },
  { mime = "text/*",        use = [ "hx" ] },
]
