# glow - private config
# 适用平台: 全平台通用（同一份文件可用于 Windows / macOS / Linux）
# 位置: ~/.config/glow/glow.yml 或 %APPDATA%\glow\glow.yml
# 实测版本: glow v3.0.0（go install charm.land/glow/v3@latest，见 docs/linux-fedora/INSTALL.md）
# 优先级: 命令行参数 > 环境变量 > 本文件

# style name or JSON path (default "auto")
style: "auto"
# mouse support (TUI-mode only)
mouse: false
# use pager to display markdown
pager: false
# word-wrap at width (0 = auto-detect terminal/tmux pane width, capped at 120)
# 注意：`glow config` 生成的默认模板写死 width: 80，会关闭自适应；
# v3 的自适应有 120 列硬上限，需更宽时用 GLOW_WIDTH / -w 显式指定
width: 0
# show all files, including hidden and ignored.
all: false
