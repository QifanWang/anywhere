# glow - private config
# 适用平台: 全平台通用（同一份文件可用于 Windows / macOS / Linux）
# 位置: ~/.config/glow/glow.yml 或 %APPDATA%\glow\glow.yml
# 优先级: 命令行参数 > 环境变量 > 本文件

# auto / dark / light / 自定义 JSON 主题路径
style: "auto"

# 默认换行宽度；0 表示自适应终端
width: 100

# TUI 中启用鼠标滚轮
mouse: true

# 默认交给系统 Pager（如 less）查看长文档
pager: false

# 是否包含隐藏文件及 .gitignore 中的文件
all: false
