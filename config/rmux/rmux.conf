# RMUX - private config
# 适用平台: Windows 11 原生（其他平台用 config/tmux/tmux.conf）
# 查找顺序: %XDG_CONFIG_HOME%\rmux\rmux.conf -> %USERPROFILE%\.rmux.conf
#           -> %APPDATA%\rmux\rmux.conf -> %RMUX_CONFIG_FILE%
# 本仓库由 scripts/win11/bootstrap.ps1 链接到 XDG 位置与 %APPDATA%\rmux
# 语法与 tmux 兼容，但 Windows 剪贴板需要显式的 UTF-8 命令

# ---------- 前缀键 ----------
# 保持出厂默认 C-b，与 config/tmux/tmux.conf 一致。
# 若以后要改成 C-a，在此加入：
#   unbind C-b
#   set -g prefix C-a
#   bind C-a send-prefix

# ---------- 基本 ----------
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g history-limit 100000
set -g display-time 2000
set -g display-panes-time 2000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g status-keys vi
set -g focus-events on
set -g status on
set -g status-position bottom
# 状态栏配色：统一用 status-style（rmux 默认是绿底黑字，单独设的 status-bg 会被它盖掉，
# 且默认 fg=default 在深色终端上看不清）。Catppuccin Mocha：深底 + 浅字，保证黑屏幕下清晰。
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
# 进入复制模式时显示醒目的反色标记，避免"误进 copy-mode 却没察觉、按 g 跳到开头"。
set -g status-left '#{?pane_in_mode,#[reverse] COPY #[default],}[#{session_name}] '
set -g status-left-length 20

# ---------- 鼠标 ----------
# 默认开启：多 panel 时滚轮才能滚动各 pane 的历史、拖拽才能调整分屏边界。
# 代价是终端原生选择/双击选择被 rmux 接管；需要原生选择时按 C-b T 临时关掉，
# 复制请用 copy-mode 的 y / C-c（见下）。再按 C-b T 切回面板鼠标模式。
set -g mouse on
bind T if-shell -F '#{mouse}' \
  'set -g mouse off ; display-message "mouse OFF: native terminal selection enabled"' \
  'set -g mouse on ; display-message "mouse ON: pane mouse mode enabled"'

# ---------- 窗口 / 面板 ----------
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------- 复制模式 (vi) ----------
# RMUX 把选中内容以 UTF-8 字节写到 copy-command 的 stdin。
# 不要用裸 clip.exe：它会按 OEM 代码页解码，非 ASCII 字符会乱码。
set -s copy-command 'powershell -NoProfile -NonInteractive -Command "[Console]::InputEncoding=[Text.Encoding]::UTF8; Set-Clipboard -Value ([Console]::In.ReadToEnd())"'

bind [ copy-mode
bind ] paste-buffer -p
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel

# ---------- 重载 ----------
# source-file 不展开 $HOME / ~ / %VAR%（Windows 原生版会把 $HOME 当成空串），
# 只有 run-shell 里的 cmd 才会展开 %XDG_CONFIG_HOME%。借它拼出实际路径再 source。
bind r run-shell 'rmux source-file "%XDG_CONFIG_HOME%/rmux/rmux.conf"' \; display-message "rmux.conf reloaded"
